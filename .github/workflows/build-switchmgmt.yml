name: Build pfSense-pkg-switchmgmt

on:
  push:
    branches: [feature/switchmgmt]
    paths:
      - 'net-mgmt/pfSense-pkg-switchmgmt/**'
      - '.github/workflows/build-switchmgmt.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            net-mgmt/pfSense-pkg-switchmgmt
          sparse-checkout-cone-mode: false

      - name: Build package on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "14.1"
          usesh: true
          run: |
            set -e

            PKG_NAME="pfSense-pkg-switchmgmt"
            PKG_VERSION="0.1.0"
            PORT_DIR="net-mgmt/${PKG_NAME}"
            STAGEDIR="/tmp/stage"
            METADIR="/tmp/meta"
            PREFIX="/usr/local"
            DATADIR="${PREFIX}/share/${PKG_NAME}"

            echo "==> Staging files"
            mkdir -p "${STAGEDIR}${PREFIX}/pkg"
            mkdir -p "${STAGEDIR}${PREFIX}/www"
            mkdir -p "${STAGEDIR}${DATADIR}"
            mkdir -p "${STAGEDIR}/etc/inc/priv"

            cp "${PORT_DIR}/files/etc/inc/priv/switchmgmt.priv.inc" \
               "${STAGEDIR}/etc/inc/priv/"
            cp "${PORT_DIR}/files${PREFIX}/pkg/switchmgmt.xml" \
               "${STAGEDIR}${PREFIX}/pkg/"
            cp "${PORT_DIR}/files${PREFIX}/pkg/switchmgmt_settings.xml" \
               "${STAGEDIR}${PREFIX}/pkg/"
            cp "${PORT_DIR}/files${PREFIX}/pkg/switchmgmt.inc" \
               "${STAGEDIR}${PREFIX}/pkg/"
            cp "${PORT_DIR}/files${PREFIX}/pkg/switchmgmt_poll.php" \
               "${STAGEDIR}${PREFIX}/pkg/"
            cp "${PORT_DIR}/files${PREFIX}/www/status_switchmgmt.php" \
               "${STAGEDIR}${PREFIX}/www/"
            cp "${PORT_DIR}/files${DATADIR}/info.xml" \
               "${STAGEDIR}${DATADIR}/"

            sed -i '' "s|%%PKGVERSION%%|${PKG_VERSION}|g" \
               "${STAGEDIR}${DATADIR}/info.xml"

            echo "==> Creating package manifest (UCL format)"
            mkdir -p "${METADIR}"
            cat > "${METADIR}/+MANIFEST" <<'ENDMANIFEST'
            name: "pfSense-pkg-switchmgmt"
            version: "0.1.0"
            origin: "net-mgmt/pfSense-pkg-switchmgmt"
            comment: "pfSense Switch Management package"
            maintainer: "coreteam@pfsense.org"
            www: "https://www.pfsense.org"
            prefix: "/"
            desc: "SNMP-based switch monitoring for pfSense. Polls network switches for per-port traffic counters, error counts, and discards."
            categories: ["net-mgmt"]
            deps: {
              "net-snmp": {
                origin: "net-mgmt/net-snmp",
                version: "5.0"
              }
            }
            ENDMANIFEST
            sed -i '' 's/^            //' "${METADIR}/+MANIFEST"

            echo "==> Creating install/deinstall scripts"
            cat > "${METADIR}/+POST_INSTALL" <<'ENDSCRIPT'
            #!/bin/sh
            /usr/local/bin/php -f /etc/rc.packages pfSense-pkg-switchmgmt POST-INSTALL
            ENDSCRIPT
            sed -i '' 's/^            //' "${METADIR}/+POST_INSTALL"
            chmod +x "${METADIR}/+POST_INSTALL"

            cat > "${METADIR}/+PRE_DEINSTALL" <<'ENDSCRIPT'
            #!/bin/sh
            /usr/local/bin/php -f /etc/rc.packages pfSense-pkg-switchmgmt DEINSTALL
            ENDSCRIPT
            sed -i '' 's/^            //' "${METADIR}/+PRE_DEINSTALL"
            chmod +x "${METADIR}/+PRE_DEINSTALL"

            echo "==> Generating plist"
            (cd "${STAGEDIR}" && find . -type f | sed 's|^\./||' | sort) > "${METADIR}/plist"

            echo "==> Contents of +MANIFEST:"
            cat "${METADIR}/+MANIFEST"
            echo "==> Contents of plist:"
            cat "${METADIR}/plist"

            echo "==> Building .pkg"
            mkdir -p /tmp/pkg-output
            pkg create -o /tmp/pkg-output -p "${METADIR}/plist" -r "${STAGEDIR}" -m "${METADIR}"

            echo "==> Package built:"
            ls -la /tmp/pkg-output/

            # Copy to workspace so the upload step (on the host) can find it
            cp /tmp/pkg-output/*.pkg "${GITHUB_WORKSPACE}/${PKG_NAME}-${PKG_VERSION}.pkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfSense-pkg-switchmgmt
          path: pfSense-pkg-switchmgmt-*.pkg

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/pfSense-pkg-switchmgmt-*.pkg
