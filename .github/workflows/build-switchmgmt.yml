name: Build pfSense-pkg-switchmgmt

on:
  push:
    branches: [feature/switchmgmt]
    paths:
      - 'net-mgmt/pfSense-pkg-switchmgmt/**'
      - '.github/workflows/build-switchmgmt.yml'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            net-mgmt/pfSense-pkg-switchmgmt
          sparse-checkout-cone-mode: false

      - name: Extract version from tag or XML
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -o '<version>[^<]*</version>' net-mgmt/pfSense-pkg-switchmgmt/files/usr/local/pkg/switchmgmt.xml | head -1 | sed 's/<[^>]*>//g')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Detected version: ${VERSION}"

      - name: Build package on FreeBSD
        uses: vmactions/freebsd-vm@v1
        env:
          PKG_VERSION: ${{ steps.version.outputs.version }}
        with:
          release: "14.1"
          usesh: true
          run: |
            set -e

            PKG_NAME="pfSense-pkg-switchmgmt"
            PORT_DIR="net-mgmt/${PKG_NAME}"
            STAGEDIR="/tmp/stage"
            METADIR="/tmp/meta"
            PREFIX="/usr/local"
            DATADIR="${PREFIX}/share/${PKG_NAME}"

            echo "==> Building version ${PKG_VERSION}"
            echo "==> Staging files"
            mkdir -p "${STAGEDIR}${PREFIX}/pkg"
            mkdir -p "${STAGEDIR}${PREFIX}/www"
            mkdir -p "${STAGEDIR}${DATADIR}"
            mkdir -p "${STAGEDIR}/etc/inc/priv"

            # Privilege file
            cp "${PORT_DIR}/files/etc/inc/priv/switchmgmt.priv.inc" \
               "${STAGEDIR}/etc/inc/priv/"

            # Package config files
            for f in switchmgmt.xml switchmgmt_settings.xml switchmgmt.inc switchmgmt_ssh.inc switchmgmt_poll.php; do
              if [ -f "${PORT_DIR}/files${PREFIX}/pkg/${f}" ]; then
                cp "${PORT_DIR}/files${PREFIX}/pkg/${f}" "${STAGEDIR}${PREFIX}/pkg/"
              fi
            done

            # Web files
            for f in ${PORT_DIR}/files${PREFIX}/www/*.php; do
              if [ -f "$f" ]; then
                cp "$f" "${STAGEDIR}${PREFIX}/www/"
              fi
            done

            # Data files
            if [ -f "${PORT_DIR}/files${DATADIR}/info.xml" ]; then
              cp "${PORT_DIR}/files${DATADIR}/info.xml" "${STAGEDIR}${DATADIR}/"
              sed -i '' "s|%%PKGVERSION%%|${PKG_VERSION}|g" "${STAGEDIR}${DATADIR}/info.xml"
            fi

            echo "==> Creating package manifest (UCL format)"
            mkdir -p "${METADIR}"
            printf 'name: "%s"\nversion: "%s"\norigin: "net-mgmt/%s"\ncomment: "pfSense Switch Management package"\nmaintainer: "coreteam@pfsense.org"\nwww: "https://www.pfsense.org"\nprefix: "/"\ndesc: "Switch management for pfSense."\ncategories: ["net-mgmt"]\ndeps: {\n  "net-snmp": {\n    origin: "net-mgmt/net-snmp",\n    version: "5.0"\n  }\n}\n' \
              "${PKG_NAME}" "${PKG_VERSION}" "${PKG_NAME}" > "${METADIR}/+MANIFEST"

            echo "==> Creating install/deinstall scripts"
            printf '#!/bin/sh\n/usr/local/bin/php -f /etc/rc.packages pfSense-pkg-switchmgmt POST-INSTALL\n' > "${METADIR}/+POST_INSTALL"
            chmod +x "${METADIR}/+POST_INSTALL"

            printf '#!/bin/sh\n/usr/local/bin/php -f /etc/rc.packages pfSense-pkg-switchmgmt DEINSTALL\n' > "${METADIR}/+PRE_DEINSTALL"
            chmod +x "${METADIR}/+PRE_DEINSTALL"

            echo "==> Generating plist"
            (cd "${STAGEDIR}" && find . -type f | sed 's|^\./||' | sort) > "${METADIR}/plist"

            echo "==> Contents of plist:"
            cat "${METADIR}/plist"

            echo "==> Building .pkg"
            mkdir -p /tmp/pkg-output
            pkg create -o /tmp/pkg-output -p "${METADIR}/plist" -r "${STAGEDIR}" -m "${METADIR}"

            echo "==> Package built:"
            ls -la /tmp/pkg-output/

            # Copy to workspace for upload
            cp /tmp/pkg-output/*.pkg "${GITHUB_WORKSPACE}/${PKG_NAME}-${PKG_VERSION}.pkg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pfSense-pkg-switchmgmt
          path: pfSense-pkg-switchmgmt-*.pkg

      - name: Create release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pfSense-pkg-switchmgmt-*.pkg
